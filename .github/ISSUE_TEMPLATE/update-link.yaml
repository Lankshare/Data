name: Update or delete a link
description: Modify an existing link or delete it by leaving all optional fields blank.
title: "Update/Delete Request"
labels: ["update"]
body:
  - type: input
    id: link_id
    attributes:
      label: Link ID
      description: The ID of the link you want to modify or delete.
      placeholder: "e.g., my-blog"
    validations:
      required: true

  - type: input
    id: new_link_id
    attributes:
      label: New Link ID
      description: Optional. Change the link ID to a new value. Only lowercase letters, numbers, and hyphens are allowed. Leave blank to keep unchanged.
      placeholder: "e.g., new-blog-id"
    validations:
      required: false

  - type: input
    id: title
    attributes:
      label: Site Title
      description: Optional. New title for your site. Leave blank to keep unchanged.
    validations:
      required: false

  - type: input
    id: name
    attributes:
      label: Nickname
      description: Optional. New display name. Leave blank to keep unchanged.
    validations:
      required: false

  - type: input
    id: desc
    attributes:
      label: Site Description
      description: Optional. New description. Leave blank to keep unchanged.
    validations:
      required: false

  - type: input
    id: link
    attributes:
      label: Site Link
      description: Optional. New URL. Leave blank to keep unchanged.
    validations:
      required: false

  - type: input
    id: avatar
    attributes:
      label: Avatar
      description: |
        Optional. New avatar. Enter a QQ number or a full image URL.
        Leave blank to keep unchanged.
    validations:
      required: false

  - type: input
    id: rss
    attributes:
      label: RSS Feed URL
      description: Optional. New RSS URL. Leave blank to keep unchanged.
    validations:
      required: false
